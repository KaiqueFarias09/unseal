project:
  name: e_livre
  kind: dart-library
  description: Dart library onboarded for Steward migration.
architecture:
  extends: steward/publishable-package
  version: 1.0.0
profile: e_livre
default_severity: off
docs:
  primary: AGENTS.md
  agents:
    - AGENTS.md
targets:
  library:
    path: .
    kind: library
    runtime: dart
    artifact: library
    publishable: true
  example:
    path: example
    kind: app
    runtime: flutter
    artifact: app
    publishable: false
    capabilities: [example, assets]
exceptions: []
