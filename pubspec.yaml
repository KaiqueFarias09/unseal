name: unseal
version: 1.1.0
repository: https://github.com/KaiqueFarias09/unseal
description: >-
  Pure Dart book parsing: extract metadata, covers, content, styles,
  fonts and navigation from EPUB, MOBI, AZW3, PalmDOC, eReader/Plucker PDB,
  LRF, RTF, Markdown, CHM, FB2, DOCX, ODT, CBZ/CBR, PDF and JPEG-backed DjVu.

environment:
  sdk: ">=3.8.0 <4.0.0"

topics:
  - ebook
  - epub
  - mobi
  - fb2
  - pdf

# Base64 image payloads inside test fixtures can match the OAuth
# refresh-token pattern; they are public-domain book data, not secrets.
false_secrets:
  - test/resources/**

dev_dependencies:
  crypto: ^3.0.7
  dart_code_linter: ^4.3.0
  lints: ^6.1.0
  test: ^1.16.7

dependencies:
  archive: ^4.3.0
  collection: ^1.15.0
  html: ^0.15.7
  koni_archive: ^0.9.0
  # 7.3.1 requires Dart 3.9; unseal still supports Dart 3.8.
  markdown: '>=7.3.0 <7.3.1'
  path: ^1.8.1
  pointycastle: ^4.0.0
  web: ^1.1.0
  xml: ^7.0.1
