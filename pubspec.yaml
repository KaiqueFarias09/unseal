name: e_livre
version: 3.2.0
repository: https://github.com/KaiqueFarias09/eLivre
description: >-
  Pure Dart book parsing library. Extract metadata, covers, content,
  stylesheets, fonts and navigation from EPUB 2.0/3.0, MOBI, AZW3
  (KF8), FB2, CBZ/CBR and PDF books.

environment:
  sdk: ">=3.8.0 <4.0.0"

topics:
  - ebook
  - epub
  - mobi
  - fb2
  - pdf
  - parser

# Base64 image payloads inside test fixtures can match the OAuth
# refresh-token pattern; they are public-domain book data, not secrets.
false_secrets:
  - test/resources/**

dev_dependencies:
  crypto: ^3.0.7
  lints: ^6.1.0
  test: ^1.16.7

dependencies:
  archive: ^3.1.6
  collection: ^1.15.0
  html: ^0.15.7
  path: ^1.8.1
  pointycastle: ^4.0.0
  web: ^1.1.0
  xml: ^6.0.1
