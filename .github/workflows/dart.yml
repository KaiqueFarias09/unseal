# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # VM lane: formatting, static analysis and the full `dart test` suite on
  # the Dart VM. The four `test/web/*_test.dart` files are annotated
  # `@TestOn('browser')`, so the VM runner skips them automatically and they
  # are exercised exclusively by the `chrome` lane below.
  vm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Note: This workflow uses the latest stable version of the Dart SDK.
      # You can specify other versions if desired, see documentation here:
      # https://github.com/dart-lang/setup-dart/blob/main/README.md
      # - uses: dart-lang/setup-dart@v1
      - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed benchmark lib test tool web

      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Run VM tests
        run: dart test --exclude-tags fuzz

  # Browser lane: the four `@TestOn('browser')` files under test/web/ are
  # compiled with dart2js and executed in Chrome. ubuntu-latest runners ship
  # Google Chrome preinstalled, which the test runner discovers on PATH.
  chrome:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Run browser-only tests in Chrome
        run: dart test -p chrome test/web/
