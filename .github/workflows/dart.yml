name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # VM lane: formatting, static analysis and the full `dart test` suite on
  # the Dart VM. The four `test/web/*_test.dart` files are annotated
  # `@TestOn('browser')`, so the VM runner skips them automatically and they
  # are exercised exclusively by the `chrome` lane below.
  vm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned Dart SDK version
        id: dart-sdk
        run: echo "version=$(cat .dart-version)" >> "$GITHUB_OUTPUT"

      - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603
        with:
          sdk: ${{ steps.dart-sdk.outputs.version }}

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed benchmark lib test tool web

      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Run VM tests
        run: dart test --exclude-tags fuzz

  # Browser lane: the `@TestOn('browser')` files under test/web/ are
  # compiled with dart2js and executed in Chrome. ubuntu-latest runners ship
  # Google Chrome preinstalled, which the test runner discovers on PATH.
  chrome:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned Dart SDK version
        id: dart-sdk
        run: echo "version=$(cat .dart-version)" >> "$GITHUB_OUTPUT"

      - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603
        with:
          sdk: ${{ steps.dart-sdk.outputs.version }}

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Compile worker used by progressive-session browser tests
        run: dart compile js web/unseal_worker.dart -o test/web/unseal_worker.js

      - name: Run browser-only tests in Chrome
        run: |
          trap 'rm -f test/web/unseal_worker.js test/web/unseal_worker.js.deps test/web/unseal_worker.js.map' EXIT
          dart test -p chrome test/web/
